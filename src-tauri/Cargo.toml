[package]
name = "smol_md"
version = "1.1.2"
description = "A tiny focused Markdown editor for Windows."
authors = ["smol_md"]
edition = "2021"

[lib]
name = "smol_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Direct pins at the versions wry 0.54.4 already brings in transitively, so
# these don't add a second copy of the crate to the tree. Used by
# `export_pdf` in src/lib.rs to drive WKWebView's print machinery directly
# (save-to-PDF, no print panel) instead of through wry's own `print()`, which
# always shows one.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
    "NSDictionary",
    "NSDate",
    "NSRunLoop",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "WKWebView",
] }
